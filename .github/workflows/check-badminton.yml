name: Check East London Badminton Availability

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run availability bot
        run: |
          python bot.py --output availability-report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: availability-report
          path: availability-report.json
